# Approve the rollout before setting VERSION_AUTOMATION_ENABLED=true.
# GITHUB_TOKEN-created PRs may need human approval to run CI. No tags or staging.
name: Reconcile alpha versions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-version-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      vars.VERSION_AUTOMATION_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.5.0"
          opam-local-packages: rescript_linter.opam
      - run: opam install dune.3.24.2 --yes
      - name: Reconcile all merged PRs, not just this event
        run: node scripts/version/reconcile-cli.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
