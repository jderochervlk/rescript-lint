name: npm Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage the verified tarballs for maintainer approval with npm 2FA
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Checks and native packages
    uses: ./.github/workflows/npm.yml
    with:
      retain-packages: true

  stage:
    name: Stage npm packages for 2FA approval
    if: github.event_name == 'push' || inputs.stage
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install npm trusted-publishing support
        run: npm install --global npm@11.15.0
      - name: Download all verified package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: artifacts
      - name: Stage verified packages without approving publication
        run: npm run stage:release
