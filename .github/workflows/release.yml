name: npm Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: Stage the verified tarballs for maintainer approval with npm 2FA
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# All staging entry points share this lock. Pending runs are reconciled from main
# and the durable ledger, so replacing a pending wakeup loses no release history.
concurrency:
  group: >-
    ${{ (
      (inputs.stage == true && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    ) && 'alpha-release-staging' ||
    format('alpha-release-build-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

jobs:
  select:
    name: Select oldest pending merged version
    if: >-
      github.repository == 'jderochervlk/rescript-lint' &&
      ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.stage &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      source-sha: ${{ steps.select.outputs.source-sha }}
      version: ${{ steps.select.outputs.version }}
      pr: ${{ steps.select.outputs.pr }}
      control-sha: ${{ steps.select.outputs.control-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Confirm GitHub CLI is available
        run: command -v gh
      - id: select
        name: Reconcile registered merged versions
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS: "true"
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ALPHA_STAGING_CUTOFF: ${{ vars.ALPHA_STAGING_CUTOFF }}
        run: node scripts/version/alpha-release-select-cli.mjs

  packages:
    name: Build and verify selected source
    needs: select
    if: >-
      !cancelled() &&
      ((needs.select.result == 'success' && needs.select.outputs.selected == 'true') ||
       (github.event_name == 'workflow_dispatch' && !inputs.stage))
    uses: ./.github/workflows/npm.yml
    with:
      retain-packages: true
      source-sha: ${{ needs.select.outputs.source-sha || github.sha }}
      expected-version: ${{ needs.select.outputs.version }}
      control-sha: ${{ needs.select.outputs.control-sha || github.sha }}

  stage:
    name: Claim and stage packages for npm review
    needs: [select, packages]
    if: >-
      !cancelled() &&
      needs.select.result == 'success' && needs.packages.result == 'success' &&
      needs.select.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.control-sha }}
          persist-credentials: false
      - name: Check out selected source data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.source-sha || github.sha }}
          path: selected-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install npm trusted-publishing support
        run: npm install --global npm@11.15.0
      - name: Confirm GitHub CLI is available
        run: command -v gh
      - name: Download this run's verified package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: false
      - name: Stage only after trusted attempt protocol is available
        env:
          RELEASE_SOURCE_DIR: ${{ github.workspace }}/selected-source
          RELEASE_VERSION: ${{ needs.select.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ needs.select.outputs.source-sha || github.sha }}
          RELEASE_PULL_REQUEST: ${{ needs.select.outputs.pr }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_CUTOFF: ${{ vars.ALPHA_STAGING_CUTOFF }}
          RELEASE_STAGE: "true"
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: "true"
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run stage:release
