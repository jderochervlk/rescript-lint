name: npm Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified tarballs to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targets:
    name: Native build targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - id: targets
        name: Read shared target manifest
        run: |
          node -e 'const fs = require("node:fs"); const include = require("./npm/targets.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include})}\n`);'

  packages:
    name: npm (${{ matrix.id }})
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source and pinned ReScript parser
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3
        with:
          ocaml-compiler: "5.5.0"
          opam-local-packages: rescript_linter.opam
      - name: Confirm the tag version matches the package
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p 'require("./npm/package.json").version')"
      - name: Install build dependencies
        run: opam install . --deps-only --with-test --yes
      - name: Build and test native executable
        run: |
          opam exec -- dune build --profile release @install
          opam exec -- dune runtest --profile release
      - name: Prepare verified license and corresponding-source bundle
        run: npm run prepare:licenses
      - name: Rebuild and relink from bundled sources
        run: npm run test:rebuild
      - name: Test launcher and packaging with coverage
        run: npm test
      - name: Verify runner matches the intended package target
        env:
          EXPECTED_TARGET: ${{ matrix.id }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {detectHost} from "./npm/lib/launcher.mjs"; import {selectTarget} from "./npm/lib/platform.mjs"; assert.equal(selectTarget(detectHost(process).host).target.id, process.env.EXPECTED_TARGET);'
      - name: Pack native and launcher packages
        run: npm run pack:native
      - name: Install tarballs and test CLI outside the build environment
        run: npm run test:package
      - name: Retain verified tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.id }}
          path: dist/npm/${{ matrix.id }}/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish npm packages
    if: github.event_name == 'push' || inputs.publish
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install npm trusted-publishing support
        run: npm install --global npm@11.5.1
      - name: Download Linux x64 package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages-linux-x64-gnu
          path: artifacts/linux-x64-gnu
      - name: Download Linux ARM64 package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages-linux-arm64-gnu
          path: artifacts/linux-arm64-gnu
      - name: Publish verified packages in dependency order
        run: |
          version="$(node -p 'require("./npm/package.json").version')"
          x64="artifacts/linux-x64-gnu/jvlk-rescript-lint-linux-x64-gnu-${version}.tgz"
          arm64="artifacts/linux-arm64-gnu/jvlk-rescript-lint-linux-arm64-gnu-${version}.tgz"
          main="artifacts/linux-x64-gnu/jvlk-rescript-lint-${version}.tgz"
          test -f "$x64"
          test -f "$arm64"
          test -f "$main"
          existing=0
          for package in \
            "@jvlk/rescript-lint-linux-x64-gnu" \
            "@jvlk/rescript-lint-linux-arm64-gnu" \
            "@jvlk/rescript-lint"; do
            if npm view "$package@$version" version >/dev/null 2>&1; then
              existing=$((existing + 1))
            fi
          done
          if [ "$existing" -eq 3 ]; then
            echo "All packages are already published at $version."
          elif [ "$existing" -eq 0 ]; then
            npm publish "$x64" --access public --tag alpha
            npm view "@jvlk/rescript-lint-linux-x64-gnu@$version" version
            npm publish "$arm64" --access public --tag alpha
            npm view "@jvlk/rescript-lint-linux-arm64-gnu@$version" version
            npm publish "$main" --access public --tag alpha
          else
            echo "Partial npm release detected for $version; resolve it before retrying." >&2
            exit 2
          fi
          npm view "@jvlk/rescript-lint@$version" version
          npm exec --yes --package "@jvlk/rescript-lint@$version" -- rescript-lint --version
