name: npm Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage the verified tarballs for maintainer approval with npm 2FA
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Checks and native packages
    uses: ./.github/workflows/npm.yml
    with:
      retain-packages: true

  stage:
    name: Stage npm packages for 2FA approval
    if: github.event_name == 'push' || inputs.stage
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install npm trusted-publishing support
        run: npm install --global npm@11.15.0
      - name: Download all verified package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: artifacts
      - name: Stage verified packages without approving publication
        run: npm run stage:release
