name: npm Packages

on:
  workflow_call:
    inputs:
      retain-packages:
        description: Upload verified tarballs for release publication
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  targets:
    name: Native build targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - id: targets
        name: Read shared target manifest
        run: |
          node -e 'const fs = require("node:fs"); const include = require("./npm/targets.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include})}\n`);'

  packages:
    name: npm (${{ matrix.id }})
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source and pinned ReScript parser
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3
        with:
          ocaml-compiler: "5.5.0"
          opam-local-packages: rescript_linter.opam
      - name: Confirm the tag version matches the package
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p 'require("./npm/package.json").version')"
      - name: Install build dependencies
        run: |
          if [ "$CHECKS" = "true" ]; then
            opam install . --deps-only --with-test --with-dev-setup --yes
          else
            opam install . --deps-only --with-test --yes
          fi
        env:
          CHECKS: ${{ matrix.id == 'linux-x64-gnu' }}
      - name: Install pinned coverage tooling
        if: matrix.id == 'linux-x64-gnu'
        run: make coverage-tools
      - name: Build, check formatting, and run tests
        if: matrix.id == 'linux-x64-gnu'
        run: make check
      - name: Check generated package metadata
        if: matrix.id == 'linux-x64-gnu'
        run: git diff --exit-code -- rescript_linter.opam
      - name: Enforce per-file and overall coverage
        if: matrix.id == 'linux-x64-gnu'
        id: coverage
        run: make coverage
      - name: Upload coverage report
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            _coverage/run.*/summary.txt
            _coverage/run.*/html/
          if-no-files-found: warn
          retention-days: 14
      - name: Build native release executable
        run: opam exec -- dune build --profile release @install
      # The native suite includes POSIX file modes; Windows is covered below by
      # launcher tests and the installed CLI smoke test without the build PATH.
      - name: Test native release executable
        if: runner.os != 'Windows'
        run: |
          opam exec -- dune runtest --profile release
      - name: Prepare verified license and corresponding-source bundle
        run: npm run prepare:licenses
      - name: Rebuild and relink from bundled sources
        run: npm run test:rebuild
      - name: Test launcher and packaging with coverage
        run: npm test
      - name: Verify runner matches the intended package target
        env:
          EXPECTED_TARGET: ${{ matrix.id }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {detectHost} from "./npm/lib/launcher.mjs"; import {selectTarget} from "./npm/lib/platform.mjs"; assert.equal(selectTarget(detectHost(process).host).target.id, process.env.EXPECTED_TARGET);'
      - name: Pack native and launcher packages
        run: npm run pack:native
      - name: Install tarballs and test CLI outside the build environment
        run: npm run test:package
      - name: Retain verified tarballs
        if: inputs.retain-packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.id }}
          path: dist/npm/${{ matrix.id }}/*.tgz
          if-no-files-found: error
          retention-days: 30
