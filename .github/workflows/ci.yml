name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The shared Linux job installs development dependencies and runs make check,
  # including OCaml lint. Release and coverage checks remain in the same job.
  packages:
    name: Checks and native packages
    uses: ./.github/workflows/npm.yml
